services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: amilo
      POSTGRES_PASSWORD: amilo
      POSTGRES_DB: amilo
    ports:
      - "5433:5432"
    volumes:
      - amilo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amilo -d amilo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  amilo_pg:
